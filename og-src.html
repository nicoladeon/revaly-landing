<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
  /* Image de partage 1200 × 630 (assets/og.jpg) : le H1 de l'accueil et les six personnages equipe-v6. Geist seule. */
  @font-face { font-family: Geist; src: url('assets/fonts/geist-var.woff2') format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F5F8; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; padding: 52px 64px 0;
    background: radial-gradient(70% 60% at 50% 0%, #EEF0FE 0%, #F4F5F8 60%);
    font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; color: #171A21; }
  .haut { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 500; font-size: 30px; letter-spacing: -0.025em; }
  .logo b { color: #636979; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px;
    background: #fff; border: 1px solid rgba(23,26,33,.14); font-size: 19px; font-weight: 500; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: #6366F1; box-shadow: 0 0 0 4px #EEF0FE; }
  h1 { margin-top: 34px; font-weight: 500; font-size: 66px; line-height: 1.02; letter-spacing: -0.045em; }
  h1 span { color: #6366F1; }
  .sub { margin-top: 16px; font-size: 24px; line-height: 1.4; color: #5A6072; }
  .tableau { position: absolute; left: 64px; right: 64px; bottom: -28px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;
    padding: 18px 18px 46px; background: #fff; border: 1px solid rgba(23,26,33,.12); border-bottom: 0; border-radius: 26px 26px 0 0;
    box-shadow: 0 0 0 1px rgba(99,102,241,.10), 0 -10px 50px -20px rgba(99,102,241,.45); }
  .ag { text-align: center; }
  .ag img { display: block; width: 100%; aspect-ratio: 1; border-radius: 18px; background: #F1F2F7; }
  .ag b { display: block; margin-top: 10px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .ag span { display: block; font-size: 15px; color: #5A6072; }
</style></head><body>
<div class="og">
  <div class="haut">
    <div class="logo">Revaly<b>.</b></div>
    <div class="pill"><i></i>6 agents IA spécialistes de l'immobilier</div>
  </div>
  <h1>Une équipe d'agents IA qui<br>travaille <span>vraiment</span> pour toi.</h1>
  <p class="sub">Visites confirmées, vendeurs informés, mandats suivis, posts prêts.</p>
  <div class="tableau">
    <div class="ag"><img src="assets/equipe/portraits/max@512.webp" alt=""><b>Max</b><span>coordinateur</span></div>
    <div class="ag"><img src="assets/equipe/portraits/emma@512.webp" alt=""><b>Emma</b><span>assistante</span></div>
    <div class="ag"><img src="assets/equipe/portraits/lucas@512.webp" alt=""><b>Lucas</b><span>estimateur</span></div>
    <div class="ag"><img src="assets/equipe/portraits/christine@512.webp" alt=""><b>Christine</b><span>juridique</span></div>
    <div class="ag"><img src="assets/equipe/portraits/zoe@512.webp" alt=""><b>Zoé</b><span>communication</span></div>
    <div class="ag"><img src="assets/equipe/portraits/raphael@512.webp" alt=""><b>Raphaël</b><span>visuels</span></div>
  </div>
</div>
</body></html>
